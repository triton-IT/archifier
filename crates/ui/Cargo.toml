[package]
name = "archifier-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Interface Archifier (Leptos CSR → WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
archifier-core = { path = "../core" }
archifier-metamodel = { path = "../metamodel" }
archifier-repo = { path = "../repo" }
leptos = { version = "0.8", features = ["csr"] }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement",
  "HtmlTextAreaElement", "HtmlSelectElement", "EventTarget", "Event",
  "DomRect", "MouseEvent", "WheelEvent", "PointerEvent", "KeyboardEvent", "Storage", "Location", "Navigator", "IdbFactory",
  "Blob", "Url", "HtmlAnchorElement", "StorageManager", "StorageEstimate",
  "File", "FileList", "FileReader", "BroadcastChannel", "MessageEvent", "Clipboard",
] }


