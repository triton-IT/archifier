[workspace]
resolver = "2"
members = ["crates/core", "crates/metamodel", "crates/repo", "crates/ui", "crates/collab"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing", "macros"] }
ulid = { version = "1", features = ["serde"] }
toml = "0.8"
sha2 = "0.10"
serde_yaml_ng = "0.10"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true



