openapi: 3.0.3
info:
  title: Petstore 3.0
  version: 1.0.0
  description: API de démonstration pour l'import OpenAPI 3.0.
servers:
  - url: https://api.petstore.example/v1
    description: Production
security:
  - oauth2:
      - read:pets
      - write:pets
paths:
  /pets:
    get:
      operationId: listPets
      summary: Lister les animaux
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            maximum: 100
      responses:
        '200':
          description: Liste des animaux
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      summary: Créer un animal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Animal créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{petId}:
    get:
      operationId: getPet
      summary: Lire un animal
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Animal trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Animal inconnu
    delete:
      operationId: deletePet
      summary: Supprimer un animal
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Animal supprimé
        '404':
          description: Animal inconnu
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.petstore.example/token
          scopes:
            read:pets: Lire les animaux
            write:pets: Modifier les animaux
